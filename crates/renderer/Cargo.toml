[package]
name = "renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [
    "rlib",
    "cdylib",
]

[dependencies]
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { 
    workspace = true, 
    features = [
        "Window",
        "Document",
        "Element",
        "HtmlCanvasElement",
    ],
}