[workspace]
resolver = "2"
members = [
    "crates/renderer",
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }

renderer = { path = "crates/renderer"}

# models
gltf = { version = "1.4", features = ["import", "utils"]}
image = "0.25"

# render
wgpu = "26"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# workspace
ui = { path = "packages/ui" }
api = { path = "packages/api" }

[patch.crates-io]
wgpu_context = { path = "patches/wgpu_context" }
blitz-paint = { path = "patches/blitz-paint" }