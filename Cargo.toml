[workspace]
resolver = "2"
members = [
    "crates/rederer"
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }

# render
wgpu = "30"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# workspace
ui = { path = "packages/ui" }
api = { path = "packages/api" }
