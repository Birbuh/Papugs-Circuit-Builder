[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus.workspace = true
dioxus-web = "0.7.10"
wgpu = { workspace = true, features = ["webgl"] }
renderer.workspace = true
glam.workspace = true
bytemuck.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = {
    version = "0.3",
    features = [
        "console",
        "Element",
        "HtmlCanvasElement",
        "Window",
    ]
}
gloo-timers = {
    version = "0.3",
    features = ["futures"]
}

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
