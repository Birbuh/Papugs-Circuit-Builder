[package]
name = "mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }

papugs-renderer = {
    path = "../crates/renderer",
    optional = true,
}

[features]
default = []
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "ui/server"]
