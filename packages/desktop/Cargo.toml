[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack", "native"] }
dioxus-native = "0.7.10"
ui = { workspace = true }
wgpu.workspace = true
renderer.workspace = true
gltf.workspace = true
image.workspace = true
tokio = { version = "1", features = ["time"] }

[features]
default = []
desktop = ["dioxus/desktop"]
server = ["dioxus/server", "ui/server"]
